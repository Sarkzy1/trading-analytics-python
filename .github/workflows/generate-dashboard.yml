name: Generate portfolio dashboard

on:
  push:
    paths:
      - "notebooks/**"
      - "data/raw/**"
      - "requirements.txt"
      - "reports/analytical_report_reviewed.md"
      - "scripts/**"
      - ".github/workflows/generate-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbconvert reportlab
      - name: Execute portfolio notebook
        run: jupyter nbconvert --to notebook --execute notebooks/Trading_Performance_Dashboard.ipynb --output /tmp/trading_dashboard_executed.ipynb --ExecutePreprocessor.timeout=600
      - name: Generate PDF reading copy
        run: python scripts/render_report_pdf.py
      - name: Verify outputs
        run: python tests/verify_outputs.py
      - name: Publish generated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed figures reports
          if ! git diff --cached --quiet; then
            git commit -m "Generate verified dashboard and report exports"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
